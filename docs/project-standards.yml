contract_version: 0.2.0
standards_version: 0.4.0

standards_source:
  repository: https://github.com/kois-studio/engineering-standards
  revision: 3e3d423

project:
  name: kois-gallery
  lifecycle: greenfield
  maturity: project-implementation

standards:
  - documentation
  - testing
  - typescript
  - security
  - dependencies
  - ci-cd
  - operations
  - api
  - data
  - web
  - identity

profiles:
  - angular-application
  - nestjs-backend

compliance:
  rules:
    - id: DOC-001
      status: partial
      evidence: docs/AGENTS.md documents project-implementation sessions, repository boundaries, validation commands, and release-state honesty.
      priority: high
      next_action: Keep implementation and landing instructions aligned with the accepted stack and operating model.
    - id: DOC-002
      status: compliant
      evidence: docs/README.md indexes the maintained project documentation.
      priority: medium
      next_action: Keep the index current as design documents are added.
    - id: DOC-011
      status: compliant
      evidence: docs/work/TODO.md is the tracked unfinished-work queue.
      priority: medium
      next_action: Keep unfinished implementation, verification, landing, and release work itemized.
    - id: DOC-003
      status: partial
      evidence: Product, architecture, operations, work, and checkpoint sources are indexed; implemented behavior and unresolved beta evidence are now cross-linked.
      priority: high
      next_action: Keep product intent, implementation facts, and release evidence separate as the beta evolves.
    - id: SEC-001
      status: partial
      evidence: docs/architecture/boundaries.md records administrator, visitor, media, storage, and operator trust boundaries; threat review and negative tests remain open.
      priority: high
      next_action: Complete the threat and responsibility review before beta release.
    - id: SEC-003
      status: partial
      evidence: The local administrator session boundary, CSRF checks, visitor bearer-link enforcement, token rotation, unpublish revocation, and denied-access tests are implemented; the full release matrix remains open.
      priority: high
      next_action: Complete the production-proxy and full negative-test matrix in GAL-016/GAL-017.
    - id: SEC-004
      status: partial
      evidence: Upload count/size/signature validation, generated storage keys, atomic writes, symlink rejection, private-media authorization, and direct-object denial are implemented; fuzzing and release-scale failure tests remain open.
      priority: high
      next_action: Extend malformed-file, token, storage-failure, and direct-object rejection tests in GAL-012 and GAL-016/GAL-017.
    - id: SEC-005
      status: partial
      evidence: Private media, database, storage, backups, and operator responsibilities are documented; retention, encryption, and deletion behavior remain incomplete.
      priority: high
      next_action: Resolve the beta privacy/retention policy and document operator controls before release.
    - id: SEC-006
      status: partial
      evidence: Documentation prohibits secret and private-media leakage; NestJS and worker logging exist with bounded messages, but a structured diagnostic/error contract remains open.
      priority: medium
      next_action: Define safe log fields and external error behavior during implementation.
    - id: SEC-008
      status: partial
      evidence: Authentication rejection, session expiry, CSRF, setup re-entry, failed-login throttling, upload authorization, private-media, token rotation, unpublish, and cross-gallery rejection tests exist; production-proxy behavior remains pending.
      rationale: The access model is accepted and implemented for the first product boundary; release verification remains.
      priority: high
      next_action: Complete release security verification in GAL-016/GAL-017.
    - id: DATA-001
      status: partial
      evidence: The first-beta tables, repositories, gallery domain service, photo upload service, private delivery service, and lifecycle boundaries exist; selections and broader delivery remain deferred.
      priority: high
      next_action: Verify the implemented lifecycle against the release matrix and real workflow evidence.
    - id: DATA-002
      status: partial
      evidence: The numbered SQL migration runner and clean-install/idempotent-run tests exist; upgrade and migration-failure coverage remain incomplete.
      rationale: The accepted query layer and migration approach are now implemented for the initial schema.
      priority: high
      next_action: Add an upgrade migration and failure-path coverage when the schema next changes.
    - id: DATA-004
      status: partial
      evidence: The two-store database/filesystem boundary, local storage key/symlink protections, durable processing state, cancellation markers, startup temporary-file cleanup, read-only integrity reporting, and confirmation-gated repair are implemented; the container/operator restore gate remains open.
      priority: high
      next_action: Use verification and repair during the GAL-017 restore exercise and record the operator result.
    - id: DATA-007
      status: partial
      evidence: docs/operations/backup-recovery.md defines the two-store backup/restore contract; `npm run storage:verify` and the synthetic two-store recovery e2e check restored object references, but the container/operator gate remains open.
      priority: high
      next_action: Execute GAL-017 using synthetic or approved assets before beta.
    - id: OPS-009
      status: partial
      evidence: docs/operations/backup-recovery.md and deploy/README.md define operator responsibilities and provide integrity verification plus confirmation-gated repair; the local synthetic restore is automated, while the container-level procedure is not yet exercised.
      priority: high
      next_action: Execute the documented restore gate in GAL-017 and record the integrity report and operator actions.
    - id: OPS-001
      status: partial
      evidence: Zod startup validation covers runtime environment, port, database path, storage path, CORS origin, and optional setup token; deployment-specific secret and filesystem checks remain open.
      rationale: The first runtime configuration exists and must remain fail-closed as new settings are added.
      priority: high
      next_action: Add configuration failure-path tests and verify production deployment values in GAL-016/GAL-017.
    - id: OPS-005
      status: partial
      evidence: The API exposes health/readiness behavior, startup migrations, and writable database/storage checks; worker and release-container readiness still need verification.
      rationale: The runtime foundation exists; later slices must extend readiness as durable domain resources are added.
      priority: medium
      next_action: Verify readiness and health behavior in the packaged container during GAL-016/GAL-017.
    - id: OPS-006
      status: partial
      evidence: The in-process worker has bounded concurrency, restart requeue behavior, cancellation-aware completion guards, and startup temporary-file cleanup; workload and termination evidence remain incomplete.
      rationale: The worker exists for the first beta, while lifecycle hardening remains implementation/release work.
      priority: high
      next_action: Verify interruption/requeue behavior and active-work shutdown in GAL-016/GAL-017.
    - id: API-001
      status: partial
      evidence: Angular and NestJS are separate logical applications connected by a tested internal HTTP boundary; a machine-readable public contract remains intentionally deferred.
      rationale: There is no independently consumed public API, but the internal boundary is now implemented and must remain coherent before headless consumers are accepted.
      priority: medium
      next_action: Record the internal route contract and reassess public contract strength before accepting a headless consumer, SDK, MCP server, or public API.
    - id: WEB-001
      status: partial
      evidence: Angular admin and visitor routes are implemented and covered by a packaged Playwright journey; manual accessibility, performance, and production proxy audits remain open.
      rationale: The functional browser slice exists; release-quality rendered-page evidence remains.
      priority: medium
      next_action: Complete responsive, accessibility, performance, and production-proxy audits before beta.
    - id: ANGULAR-001
      status: partial
      evidence: Angular admin/auth, gallery management, upload, and visitor delivery components are organized by product capability; the visual system remains intentionally small.
      rationale: The first product capabilities are implemented; the structure should be revisited if selections or theming are added.
      priority: medium
      next_action: Keep capability boundaries coherent during release hardening and future feature work.
    - id: ANGULAR-002
      status: partial
      evidence: Angular components handle presentation and client orchestration while NestJS services/repositories enforce domain and authorization rules; representative responsibilities are covered by the implemented journey.
      rationale: The boundary is implemented for the first slice; later UI capabilities must preserve it.
      priority: high
      next_action: Review new components against the same boundary during release hardening.
    - id: ANGULAR-003
      status: partial
      evidence: The Angular API service has typed request/response models and upload progress handling; a generated or machine-readable contract remains deferred.
      rationale: The first internal boundary is typed in code, while an independently consumed API contract is not yet required.
      priority: high
      next_action: Keep typed models synchronized with NestJS routes and reassess contract generation before headless consumers.
    - id: ANGULAR-004
      status: partial
      evidence: Auth, upload, processing, cancellation, publication, and visitor browsing states are represented with Angular signals and tested through the critical browser journey.
      rationale: The first UI slice models its relevant state; selections, richer retry UX, and broader workflows remain deferred.
      priority: high
      next_action: Verify failure/retry/accessibility behavior in release review and extend states only for accepted workflows.
    - id: ANGULAR-005
      status: partial
      evidence: A coherent SCSS visual system is implemented for the first admin and visitor surfaces without a separate icon dependency.
      rationale: The first beta intentionally uses a small visual system; extensive theming remains deferred.
      priority: low
      next_action: Keep styling accessible and consistent; revisit theming only when a real photographer requirement exists.
    - id: ANGULAR-006
      status: partial
      evidence: Angular forms constrain required local inputs and the API service uses typed response models; NestJS remains authoritative for runtime validation.
      rationale: Client validation improves interaction but cannot replace backend boundary checks.
      priority: high
      next_action: Add focused client rejection tests where they improve UX and retain backend negative tests as the security contract.
    - id: ANGULAR-007
      status: partial
      evidence: Feature-local signals own admin and visitor view state; the API service owns only upload activity and no global store is introduced.
      rationale: The first product slice has no justified cross-feature state requirement.
      priority: high
      next_action: Preserve feature-local ownership and introduce shared state only when a concrete cross-route workflow requires it.
    - id: ANGULAR-008
      status: partial
      evidence: Domain and authorization rules remain in NestJS services/repositories; Angular components orchestrate HTTP interactions and view state.
      rationale: The first slice has no complex client-only domain rules.
      priority: medium
      next_action: Keep new non-trivial client rules independently testable rather than embedding them in templates.
    - id: ANGULAR-009
      status: partial
      evidence: Angular routes cover setup, sign-in, admin, share bootstrap, and visitor browsing; backend guards remain authoritative and client routing does not claim authorization.
      rationale: The first app relies on server session/bearer authorization rather than duplicating security rules in the client.
      priority: high
      next_action: Add client route/error tests where they materially improve onboarding while preserving backend denial tests.
    - id: ANGULAR-010
      status: partial
      evidence: HTTP subscriptions are scoped to component interactions and signal state; the critical browser journey passes without known teardown failures.
      rationale: The first slice has limited long-lived reactive work and no global effect system.
      priority: high
      next_action: Check repeated navigation and teardown during accessibility/release review.
    - id: ANGULAR-011
      status: partial
      evidence: Playwright covers administrator setup/upload/publish and visitor browse/download at desktop and mobile viewport configurations.
      rationale: The core journey exists; broader matrix and production-host checks remain.
      priority: high
      next_action: Extend the matrix with negative, keyboard, and production-proxy cases before beta.
    - id: ANGULAR-012
      status: partial
      evidence: Angular strict injection/input compiler options are enabled and production builds pass; the full strict template profile remains to be reviewed.
      rationale: The selected framework baseline is active, with remaining profile evidence tracked separately.
      priority: high
      next_action: Verify the remaining strict template/profile checks in release review.
    - id: ANGULAR-013
      status: partial
      evidence: docs/architecture/overview.md and docs/architecture/boundaries.md make NestJS/backend authorization authoritative; direct unauthenticated, cross-gallery, revoked-link, and direct-object denial paths are covered.
      priority: high
      next_action: Complete the remaining release security matrix and reverse-proxy checks.
    - id: ANGULAR-014
      status: partial
      evidence: Loading, empty, success, error, cancellation, and ready states exist in the implemented admin/visitor views; richer retry UX remains limited.
      rationale: The first beta exposes the states needed by the current workflow.
      priority: high
      next_action: Verify the implemented states during browser/accessibility review and add retry behavior where evidence requires it.
    - id: ANGULAR-015
      status: partial
      evidence: View state is intentionally ephemeral and feature-local; no persistent client cache or global state is required by the first beta.
      rationale: Persistence would create synchronization and privacy obligations without a current requirement.
      priority: medium
      next_action: Reassess persistence only if selections, offline work, or a multi-step workflow makes it necessary.
    - id: NEST-001
      status: partial
      evidence: NestJS modules separate access, gallery, storage, upload/processing, and share delivery responsibilities.
      rationale: The first capability boundaries are implemented; future selections and adapters may introduce new modules.
      priority: medium
      next_action: Preserve capability boundaries while completing release hardening.
    - id: NEST-002
      status: partial
      evidence: Implemented controllers delegate domain operations to services/repositories, including auth, galleries, uploads, and visitor delivery.
      rationale: The separation is now observable in the auth, gallery, storage, and upload slices.
      priority: high
      next_action: Review new release/operator commands against the same separation.
    - id: NEST-003
      status: partial
      evidence: Gallery, upload, processing, storage, integrity, and share rules are implemented in services/repositories separate from HTTP handlers.
      rationale: Transport-independent rules are now testable for the implemented slices.
      priority: high
      next_action: Keep new recovery and release behavior transport-independent where practical.
    - id: NEST-004
      status: partial
      evidence: Zod validates configuration, service boundaries validate domain inputs, and controllers reject malformed/unauthorized requests; DTO generation is not used.
      rationale: The first application uses explicit schemas and service validation rather than a DTO-heavy transport layer.
      priority: high
      next_action: Extend negative tests as new routes or request shapes are added.
    - id: NEST-005
      status: partial
      evidence: NestJS maps boundary failures to safe HTTP responses and the worker logs bounded processing errors; structured correlation and a formal error envelope remain open.
      rationale: The first beta has safe basic errors but not an observability system.
      priority: medium
      next_action: Define the minimal release logging/error contract before production beta.
    - id: NEST-006
      status: partial
      evidence: Auth, gallery, storage, upload/processing, and share modules expose capability-specific providers/controllers; no public module API is promised.
      rationale: The application is a single installation, not a plugin or microservice platform.
      priority: high
      next_action: Review module exports and boundaries when recovery or future adapters expand.
    - id: NEST-007
      status: partial
      evidence: Module imports and provider injection make cross-capability dependencies explicit; storage and database are global infrastructure boundaries.
      rationale: The first monolith does not need a separate dependency-graph artifact.
      priority: medium
      next_action: Revisit dependency direction if S3, SDK, MCP, or selections become active consumers.
    - id: NEST-008
      status: partial
      evidence: Architecture places authorization and domain invariants beyond controllers; service/repository tests and HTTP e2e tests cover direct and alternate entry points for the current slices.
      priority: high
      next_action: Extend alternate-entry-point tests for each new privileged operation.
    - id: NEST-009
      status: partial
      evidence: Configuration, passwords, gallery inputs, upload headers/content, tokens, and route authorization are validated at NestJS boundaries.
      rationale: The current surface has implementation evidence; fuzzing and full malformed-input coverage remain release work.
      priority: high
      next_action: Extend malformed-input and failure-path tests during release verification.
    - id: NEST-010
      status: partial
      evidence: Controllers return safe status/message responses for current failure paths; a versioned error DTO/filter contract is not yet required.
      rationale: The first beta has one internal frontend consumer and no public API compatibility promise.
      priority: high
      next_action: Record the internal error expectations and formalize them before a second consumer.
    - id: NEST-011
      status: partial
      evidence: NestJS startup validation covers runtime paths, URLs, ports, and the optional setup secret; secret leakage and deployment checks remain open.
      rationale: The initial runtime configuration exists; later slices must keep new settings validated and secret-safe.
      priority: high
      next_action: Verify production values, mounted permissions, and secret handling in the container gate.
    - id: NEST-012
      status: partial
      evidence: SQLite, local storage, and Sharp processing providers exist behind application-facing services; S3 and other adapters remain deferred.
      rationale: The first local installation has implementation evidence for its selected infrastructure boundaries.
      priority: high
      next_action: Keep the local adapters reliable; add S3 compatibility only when a real deployment requires it.
    - id: NEST-013
      status: partial
      evidence: Gallery writes use database constraints, local atomic-write boundaries, transactional photo/job creation, and durable cancellation markers; storage-failure recovery remains open.
      priority: high
      next_action: Implement and test transaction/partial-failure behavior during GAL-009, GAL-011, GAL-012, and GAL-017.
    - id: NEST-014
      status: partial
      evidence: The NestJS in-process worker claims durable jobs, limits concurrency, retries failures, requeues interrupted claims, honors cancellation, and cleans stale upload temporary files; representative workload and termination evidence remain open.
      rationale: The first worker implementation exists, while release-scale behavior is still unverified.
      priority: high
      next_action: Verify processing retry/interruption behavior and representative workload in GAL-016/GAL-017; decide whether upload idempotency is needed.
    - id: NEST-015
      status: partial
      evidence: Database, storage, and in-process worker lifecycle resources exist; termination and release-container checks remain open.
      rationale: Runtime lifecycle is implemented for the first process shape and needs release verification.
      priority: high
      next_action: Verify lifecycle, readiness, and shutdown behavior in GAL-016/GAL-017.
    - id: NEST-016
      status: partial
      evidence: Angular consumes a NestJS HTTP interface across a logical frontend/backend boundary, but no published or machine-readable contract is promised yet.
      rationale: The first release has no independent public API consumer, but the internal contract and compatibility behavior still need implementation evidence.
      priority: medium
      next_action: Define the contract and compatibility behavior during GAL-010 and GAL-015; reassess if a headless frontend, SDK, MCP server, or other independent consumer is accepted.

exceptions: []

deferred_work:
  - id: DESIGN-001
    reason: Framework and lower-level implementation choices are accepted; implementation evidence is still absent.
    next_action: Implement and verify the accepted domain slices in GAL-009 through GAL-016.
  - id: DESIGN-002
    reason: License selection requires an explicit OSS adoption decision and dependency review.
    next_action: Decide before the first meaningful public release.
  - id: DESIGN-003
    reason: Visitor selection semantics, password access, expiration, batch archives, branding, and supported source formats require Lino/workload evidence.
    next_action: Resolve through Lino observation, workload evidence, and the deferred questions; do not add placeholder product or schema commitments.
  - id: DESIGN-004
    reason: The first-beta and local/bearer-link decisions are accepted; implementation and security evidence remain incomplete.
    next_action: Implement and verify the access boundaries in GAL-010 and GAL-014.
  - id: DESIGN-005
    reason: Angular and NestJS profiles are selected for the accepted framework direction, but their implementation rules cannot be claimed compliant before code exists.
    next_action: Keep the profile assessments current as GAL-009 through GAL-016 implement and verify the framework boundaries.
