services:
  gallery:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/gallery.db
      STORAGE_PATH: /photos
      CORS_ORIGIN: http://localhost:3000
      SETUP_TOKEN: ${SETUP_TOKEN-}
    volumes:
      - ./data:/data
      - ./photos:/photos
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
